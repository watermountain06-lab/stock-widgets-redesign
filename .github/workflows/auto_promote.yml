name: Auto-promote preview

# preview(stock-widgets-preview)가 매일 만든 카드·숫자를 이 라이브 저장소로 하루 한 번 자동 승격한다(2026-10-14 사용자 결정).
# 멈춤 스위치: 저장소 변수 AUTO_PROMOTE — "on"일 때만 돈다. 끄기: gh variable set AUTO_PROMOTE -b off -R watermountain06-lab/stock-widgets-redesign
#   (또는 GitHub 저장소 Settings → Secrets and variables → Actions → Variables에서 값을 off로). 끈 동안은 예전처럼 손으로 승격한다.
# 실패 카드·테스트 실패면 올리지 않고 실패로 끝난다(GitHub이 메일로 알림). 이 저장소에 없는 새 종목은 건너뛴다(손 승격 대기). 단계는 scripts/auto_promote.sh.

on:
  schedule:
    # 뉴욕 06:03(2026-10-14 사용자 결정; 정각은 GitHub가 가장 많이 밀리고 건너뛴다). GitHub cron은 UTC뿐이라
    # 서머타임(EDT, 10:03 UTC)과 표준시(EST, 11:03 UTC)를 둘 다 걸고, when 작업이 그날 뉴욕 시각에 맞는 쪽만 통과시킨다.
    # preview의 09:23 UTC 재시도 뒤, 13:41 UTC 재시도와 뉴욕 개장 전이다.
    - cron: "3 10 * * *"
    - cron: "3 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  when:
    if: vars.AUTO_PROMOTE == 'on'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.tz.outputs.go }}
    steps:
      - id: tz
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          # (스위치가 on일 때) 수동 실행은 늘 통과. 예약 실행은 뉴욕 UTC 오프셋이 그 cron과 맞을 때만(-0400 ↔ 10시, -0500 ↔ 11시).
          # 시작이 몇 시간 밀려도 오프셋으로 고르므로 하루 한 번만 돈다.
          # cron은 시(hour) 칸만 본다 — 분이나 서식을 바꿔도 비교가 깨지지 않게(Fable)
          OFF=$(TZ=America/New_York date +%z)
          case "$OFF" in -0400|-0500) ;; *) echo "뉴욕 오프셋을 못 읽음: $OFF"; exit 1;; esac   # 조용히 0회 되지 않게(Fable)
          HOUR=$(echo "$CRON" | awk '{print $2}')
          go=false
          if [ -z "$CRON" ]; then go=true
          elif [ "$HOUR" = "10" ] && [ "$OFF" = "-0400" ]; then go=true
          elif [ "$HOUR" = "11" ] && [ "$OFF" = "-0500" ]; then go=true
          fi
          echo "cron='$CRON' 뉴욕 오프셋 $OFF → go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"
  promote:
    needs: when
    if: needs.when.outputs.go == 'true'
    # 워크플로 단위로 두면 건너뛸 cron의 실행이 대기 중인 진짜 실행을 밀어낸다 — 통과한 작업에만 건다(Codex)
    concurrency:
      group: auto-promote
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 240   # preview 갱신이 끝나기를 최대 3시간 기다린다(scripts/auto_promote.sh)
    steps:
      - uses: actions/checkout@v4
      - name: Fetch preview (full history — Tracking reads its daily_status history)
        run: git clone --quiet https://github.com/watermountain06-lab/stock-widgets-preview.git "$HOME/Workspace/stock-widgets-preview"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup
        run: |
          pip install --quiet numpy scipy   # build_value_gap가 preview의 verdict_replay.py를 읽는다(numpy·scipy, Codex)
          # rebase(시장 뉴스 push와 겹칠 때)에도 쓰이므로 작업 전체에 작성자를 둔다(Codex)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Promote
        run: bash scripts/auto_promote.sh
      - name: Push
        id: push
        run: |
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then echo "올릴 커밋 없음"; exit 0; fi
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase && git push; then pushed=true; break; fi
            git rebase --abort 2>/dev/null || true   # 시장 뉴스 작업과 같은 방식(충돌한 rebase를 남기지 않는다)
            sleep $((i * 20))
          done
          [ "$pushed" = true ] || { echo "push 실패"; exit 1; }
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # Actions 토큰으로 한 push는 Pages 빌드를 띄우지 않을 수 있어 직접 요청한다(market_news.yml과 같은 방식)
      - name: Request a Pages build
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
      # ETF(2026-10-21): ETF 입력 거부는 카드 승격을 막지 않는다 — Promote가 사유를 표시 파일에 남기면 여기서 실패해 메일로 알린다.
      # 앞 단계가 실패·건너뛰어도 돈다(Promote가 실패한 날은 그 실패 메일이 따로 간다).
      - name: ETF status
        if: always() && needs.when.outputs.go == 'true'
        run: |
          f="$RUNNER_TEMP/etf_status"
          if [ -s "$f" ]; then echo "ETF 갱신 실패 — 카드 승격은 따로 진행됐다:"; cut -c1-1000 "$f"; exit 1; fi
          echo "ETF 정상"
